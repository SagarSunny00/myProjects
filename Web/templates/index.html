<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Project Management Dashboard</h1>
        <nav>
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" style="display: none;">Logout</button>
            <span id="loggedInUser" style="display: none;"></span>
        </nav>
    </header>

    <main>
        <section id="authSection" class="card">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
            <p id="authError" class="error-message"></p>
        </section>

        <section id="dashboard" style="display: none;">
            <div class="dashboard-grid">
                <div class="card client-section">
                    <h2>Clients</h2>
                    <form id="clientForm">
                        <input type="text" id="clientName" placeholder="New Client Name" required>
                        <button type="submit">Add Client</button>
                    </form>
                    <p id="clientError" class="error-message"></p>
                    <div id="clientsList" class="list-container">
                        <h3>All Clients:</h3>
                        <ul id="clientItems">
                            <!-- Client items will be loaded here -->
                        </ul>
                    </div>
                </div>

                <div class="card project-section">
                    <h2>Projects for Selected Client</h2>
                    <p id="selectedClientName">Select a client to view/add projects.</p>
                    <form id="projectForm" style="display: none;">
                        <input type="text" id="projectName" placeholder="New Project Name" required>
                        <input type="text" id="projectUsers" placeholder="User IDs (comma-separated, e.g., 1,2)" required>
                        <button type="submit">Add Project</button>
                    </form>
                    <p id="projectError" class="error-message"></p>
                    <div id="clientProjectsList" class="list-container">
                        <h3>Projects:</h3>
                        <ul id="clientProjectItems">
                            <!-- Projects for selected client will be loaded here -->
                        </ul>
                    </div>
                </div>

                <div class="card my-projects-section">
                    <h2>My Assigned Projects</h2>
                    <div id="myProjectsList" class="list-container">
                        <ul id="myProjectItems">
                            <!-- Projects assigned to logged-in user will be loaded here -->
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Project Management. All rights reserved.</p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
